<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tu Hogar Tech">
  <title>Tu Hogar Tech</title>

  <!-- Fondo: cuadrado de esquinas rectas en el morado de la marca -->
  <rect width="100" height="100" fill="#4a2a8c"/>

  <!-- Chimenea. Se dibuja antes que la casa para que el tejado la recorte -->
  <rect x="62" y="20" width="12" height="24" fill="#ffffff"/>

  <!-- Tejado: triángulo con alero, se lee como casa incluso a 16 px -->
  <path d="M50 13 88 46H12z" fill="#ffffff"/>

  <!-- Cuerpo de la casa -->
  <rect x="24" y="50" width="52" height="33" fill="#ffffff"/>

  <!-- Rayo: la electricidad de los productos, en el morado de la marca -->
  <path d="M53.6 52 38.4 71.2h12.2L48.9 82.6 64.6 64.2H52.4L53.6 52z" fill="#4a2a8c"/>
</svg>
